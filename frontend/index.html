<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Preconnect pour performances -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://metrikdelta-backend-eu-production.up.railway.app" />

<!-- DNS Prefetch -->
<link rel="dns-prefetch" href="https://api.openf1.org" />

<!--
  The page's description, canonical address, link preview tags and its own
  JSON-LD are written in at build time for each page (the seoPages plugin in
  vite.config.ts, from src/seo/pages.ts), marked as react-helmet-async's own
  so <SEO> replaces them once the app runs instead of adding a second copy.
  The title below is replaced the same way; it stays for `vite dev`.
-->
<title>METRIK DELTA - Professional F1 Telemetry Analysis</title>
<meta name="theme-color" content="#5e1018" />

<!-- JSON-LD -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "METRIK DELTA",
  "url": "https://metrikdelta.com",
  "description": "Compare Formula 1 drivers lap by lap — speed, throttle, braking and gear telemetry, tire strategy and full head-to-head statistics from 2018 to 2026.",
  "applicationCategory": "SportsApplication",
  "operatingSystem": "Web",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "EUR",
    "description": "Free access to historical F1 seasons. PRO plan (current season, unlimited requests) from 1.99€/month."
  },
  "publisher": {
    "@type": "Organization",
    "name": "METRIK DELTA",
    "url": "https://metrikdelta.com"
  }
}
</script>

<!-- Google Fonts — loaded async (preload + swap-to-stylesheet on load) so the
     ~800ms round trip to fonts.googleapis.com doesn't block first paint.
     &display=swap in the URL still makes the fonts themselves swap in
     without a FOIT once loaded; this just stops the stylesheet fetch itself
     from blocking render before then. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"></noscript>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
